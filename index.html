<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>宵宿 YOIYADO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1f2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="宵宿">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ロゴ文字だけをサブセットで読み込む（日本語フォント全体は重いので） -->
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&text=%E5%AE%B5%E5%AE%BF0123456789%C2%A5%2C&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea;--bg2:#ece7dc;--card:#fffdf9;--ink:#1c2233;--sub:#6d6a64;--line:#e4ddcf;
  --night:#1f2a44;--night2:#2d3b5e;--gold:#b8893a;--gold-soft:#f3e7cf;
  --ok:#2f7d5b;--ok-bg:#e5f2ea;--warn:#b0462f;--warn-bg:#fbebe5;
  --shadow:0 1px 2px rgba(28,34,51,.05),0 6px 20px rgba(28,34,51,.06);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1422;--bg2:#141b2d;--card:#182033;--ink:#ece8df;--sub:#9aa0ae;--line:#2a3349;
  --night:#0b1020;--night2:#1d2742;--gold:#d8b06a;--gold-soft:#3a3221;
  --ok:#6cc79c;--ok-bg:#183126;--warn:#f0957a;--warn-bg:#3a231d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
.num{font-variant-numeric:tabular-nums}

/* ---------- ヘッダー ---------- */
.hero{background:radial-gradient(120% 140% at 85% -20%,#3b4c78 0%,var(--night2) 38%,var(--night) 100%);color:#f3eee3;padding:22px 16px 74px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 12% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 72% 18%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 88% 62%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 40% 70%,#fff4 50%,transparent 51%),radial-gradient(1px 1px at 58% 40%,#fff5 50%,transparent 51%);pointer-events:none}
.brand{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.brand svg{flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.brand .wm{display:flex;flex-direction:column;line-height:1.1}
.brand .jp{font-size:28px;font-weight:700;letter-spacing:.12em}
.brand .en{font-size:10.5px;letter-spacing:.42em;color:#d8b06a;margin-top:4px;font-weight:600}
.tagline{max-width:720px;margin:14px auto 0;font-size:13px;color:#c9cbd6;position:relative;z-index:1;letter-spacing:.04em}

main{max-width:720px;margin:-56px auto 0;padding:0 14px 40px;position:relative;z-index:2}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}

/* ---------- 検索フォーム ---------- */
.dates{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end}
.field{min-width:0}
.field label{display:block;font-size:11.5px;color:var(--sub);letter-spacing:.06em;margin:0 0 4px 2px}
input[type=date],select{width:100%;min-width:0;max-width:100%;font:inherit;font-size:15px;padding:11px 8px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);min-height:46px}
input[type=date]:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
.nights{align-self:end;margin-bottom:9px;font-size:12px;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:4px 10px;white-space:nowrap}
.row2{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;margin-top:12px;align-items:end}
button.go{width:100%;min-height:48px;font:inherit;font-size:16px;font-weight:700;letter-spacing:.06em;border:0;border-radius:12px;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--night2),var(--night));box-shadow:0 4px 14px rgba(31,42,68,.28);display:flex;align-items:center;justify-content:center;gap:8px}
button.go:active{transform:translateY(1px)}
button.go:disabled{cursor:default;opacity:.9}
button.go .moon{color:var(--gold)}
@media (prefers-color-scheme: dark){
  button.go{background:linear-gradient(135deg,#e2bd77,#c7964a);color:#1a1f2e;box-shadow:0 4px 16px rgba(216,176,106,.25)}
  button.go .moon{color:#1a1f2e}
}
.opts{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .knob{width:36px;height:21px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch input:checked + .knob{background:var(--gold)}
.switch input:checked + .knob::after{left:17px}
.switch input:focus-visible + .knob{outline:2px solid var(--gold);outline-offset:2px}
details.cond{margin-top:10px;font-size:12px;color:var(--sub)}
details.cond summary{cursor:pointer;list-style:none}
details.cond summary::before{content:"ⓘ ";}
details.cond p{margin:6px 0 0;line-height:1.7}

/* ---------- 取得状況 ---------- */
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.meta .when{font-weight:700;font-size:15px}
.meta .sub{font-size:12px;color:var(--sub)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-2px;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.prog{margin-top:12px}
.prog .msg{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:700;margin-bottom:7px;color:var(--ink);gap:8px}
.prog .msg > span:first-child{display:flex;align-items:center;gap:7px}
.prog .msg .t{font-weight:500;color:var(--sub);font-size:12.5px}
.prog .bar{height:6px;border-radius:999px;background:var(--bg2);overflow:hidden}
.prog .fill{height:100%;border-radius:999px;background:var(--gold);transition:width .5s ease}
.prog .fill.run{background:linear-gradient(90deg,var(--gold) 0%,var(--gold) 35%,#f1d9a3 50%,var(--gold) 65%,var(--gold) 100%);background-size:220% 100%;animation:shim 1.5s linear infinite}
@keyframes shim{from{background-position:110% 0}to{background-position:-110% 0}}
.prog .hint{font-size:12px;color:var(--sub);margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px 4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--sub);background:var(--bg)}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
.chip.ok{color:var(--ink)}
.chip.ok .s{color:var(--sub)}
.chip.ng{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:var(--warn-bg)}
.chip.wait{border-style:dashed}
.chip .spin{width:10px;height:10px;border-width:1.5px}
.err{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;margin-top:10px;font-size:13px}

/* ---------- ランキング ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.offer{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;box-shadow:var(--shadow);display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;position:relative;animation:pop .35s ease both}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.offer .rk{grid-row:1/4;font-size:24px;font-weight:700;color:var(--sub);line-height:1.15;text-align:center}
.offer.best{border:1.5px solid var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--card) 70%)}
.offer.best .rk{color:var(--gold)}
.offer .best-badge{position:absolute;top:-9px;left:14px;background:var(--gold);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.12em;padding:2px 8px;border-radius:999px}
.offer .hotel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);letter-spacing:.02em}
.offer .hotel .dot{width:8px;height:8px;border-radius:50%;flex:none}
.offer .room{font-weight:700;font-size:15.5px;line-height:1.4;margin-top:1px}
.offer .price{grid-row:1/3;grid-column:3;text-align:right}
.offer .price .p{font-size:22px;font-weight:700;letter-spacing:.01em;line-height:1.1}
.offer .price .per{font-size:11.5px;color:var(--sub);margin-top:2px}
.offer .price .diff{font-size:11.5px;color:var(--sub);margin-top:2px}
.offer .tags{grid-column:2/4;display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--sub);background:var(--bg)}
.tag.ok{color:var(--ok);border-color:transparent;background:var(--ok-bg)}
.tag.nr{color:var(--warn);border-color:transparent;background:var(--warn-bg)}
.tag.meal{color:var(--gold);border-color:transparent;background:var(--gold-soft)}
.offer .plan{grid-column:2/4;font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.55}
.offer .foot{grid-column:2/4;display:flex;justify-content:flex-end;margin-top:8px}
.offer .foot a{font-size:13px;font-weight:700;color:var(--night2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--bg)}
@media (prefers-color-scheme: dark){.offer .foot a{color:var(--gold)}}
.offer.alt{margin-left:26px;box-shadow:none;border-style:dashed;background:transparent}
.offer.alt .rk{font-size:14px}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:8px 0 2px}
footer{max-width:720px;margin:0 auto;padding:0 16px 28px;text-align:center;font-size:11px;color:var(--sub);letter-spacing:.08em}
@media (max-width:380px){.offer .price .p{font-size:19px}.brand .jp{font-size:25px}}

.tabs{max-width:720px;margin:14px auto 0;position:relative;z-index:1}
.tabs nav{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff2e}
.tabs a{font-size:13px;font-weight:700;letter-spacing:.05em;padding:7px 16px;border-radius:999px;text-decoration:none;color:#d9dbe5;white-space:nowrap}
.tabs a:hover{color:#fff}
.tabs a[aria-current]{background:#f3eee3;color:#1f2a44}
.tabs a:focus-visible{outline:2px solid #d8b06a;outline-offset:2px}
</style>
</head>
<body>
<header class="hero">
  <div class="brand">
    <!-- ロゴ：宵の三日月が宿の屋根にかかる -->
    <svg width="46" height="46" viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1d9a3"/><stop offset="1" stop-color="#c8963f"/></linearGradient></defs>
      <rect x="2" y="2" width="60" height="60" rx="16" fill="#ffffff14" stroke="#ffffff30"/>
      <path d="M41 13a12 12 0 1 0 11 16.5A10 10 0 0 1 41 13z" fill="url(#lg)"/>
      <path d="M12 37 L30 25 L48 37" fill="none" stroke="#f3eee3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M17 35 V50 H43 V35" fill="none" stroke="#f3eee3" stroke-width="3.2" stroke-linejoin="round"/>
      <rect x="26.5" y="40" width="7" height="10" rx="1.5" fill="url(#lg)"/>
    </svg>
    <div class="wm"><span class="jp serif">宵宿</span><span class="en">YOIYADO</span></div>
  </div>
  <div class="tagline">今夜の一泊を、いちばん賢く。会員価格をその場で比べる。</div>
<div class="tabs"><nav aria-label="ページ切り替え"><a href="./" aria-current="page">料金比較</a><a href="status.html">会員ステータス</a></nav></div>
</header>

<main>
  <section class="card" aria-label="検索条件">
    <div class="dates">
      <div class="field"><label for="date">チェックイン</label><input type="date" id="date" onchange="syncOut()"></div>
      <span class="nights num" id="nights"></span>
      <div class="field"><label for="checkout">チェックアウト</label><input type="date" id="checkout" onchange="showNights()"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="adults">人数</label>
        <select id="adults"><option value="1">1名</option><option value="2" selected>2名</option><option value="3">3名</option></select></div>
      <button class="go" id="go" onclick="go()"></button>
    </div>
    <div class="opts">
      <label class="switch"><input type="checkbox" id="showAlt" onchange="saveAlt();render()"><span class="knob"></span>返金不可の最安も表示</label>
    </div>
    <details class="cond"><summary>比較の条件</summary>
      <p>各ホテル公式サイト（京王プラザ・ニューオータニはI Prefer経由も）の会員価格・早期割引を含む最安。金額は税・サービス料・宿泊税込みの滞在合計。素泊まり優先（素泊まりが無い部屋のみ朝食付き）。順位は返金可の最安で付け、返金不可の方が安い場合はスイッチで表示。ポイント還元は含みません。</p>
    </details>
  </section>
  <div id="out"></div>
</main>
<footer>YOIYADO · 自宅PCで取得・各ホテル公式の価格 · <a href="#" onclick="showSetup();return false" style="color:inherit">合言葉</a></footer>

<script>
const GAS = "https://script.google.com/macros/s/AKfycbyXS4tQgx8U95EG5EUJd3H47_saO_Ny35XWZBWxyNY-2ck8QBLOmgAzSm6HtN7twnRXaFGf/exec";
let K = '';
(function(){
  const m = location.hash.match(/k=([0-9a-f]{20,})/i);
  try { if (m) { K = m[1]; localStorage.setItem('yoiyado_k', K); } else { K = localStorage.getItem('yoiyado_k') || ''; } }
  catch(e) { if (m) K = m[1]; }
})();
// Apps Script の応答はまれに届かないので3回まで取り直す（検索依頼は依頼番号 cid で二重登録されない）
const call = async (action, a) => {
  const p = new URLSearchParams(Object.assign({api: action, k: K}, a || {}));
  for (let i = 0; i < 3; i++) {
    try {
      const r = await fetch(GAS + '?' + p.toString(), {credentials: 'omit', cache: 'no-store'});
      const t = await r.text();
      if (t.trim().startsWith('{')) {
        const j = JSON.parse(t);
        if (j.error === 'forbidden') { const e = new Error('合言葉が違います。設定し直してください。'); e.fatal = true; throw e; }
        return j;
      }
    } catch(e) { if (e.fatal) throw e; }
    await new Promise(res => setTimeout(res, 1200 * (i + 1)));
  }
  throw new Error('通信に失敗しました。電波の良い場所で、もう一度お試しください。');
};
const NAMES = {keio:'京王プラザ', iprefer:'京王プラザ（I Prefer）', newotani:'ニューオータニ ザ・メイン（I Prefer）', groove:'ホテルグルーヴ', hilton:'ヒルトン東京', hyatt:'ハイアット リージェンシー', kimpton:'キンプトン新宿'};
const SHORT = {keio:'京王', iprefer:'京王 I Prefer', newotani:'ニューオータニ', groove:'グルーヴ', hilton:'ヒルトン', hyatt:'ハイアット', kimpton:'キンプトン'};
const COLORS = {keio:'#7a5c9e', iprefer:'#a07cc5', newotani:'#9b6b3f', groove:'#d0603c', hilton:'#2f5fa8', hyatt:'#5b8c9c', kimpton:'#3f8a5f'};
const ORDER = ['keio','iprefer','newotani','groove','hilton','hyatt','kimpton'];
const yen = n => '¥' + Number(n).toLocaleString('ja-JP');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BTN_IDLE = '<span class="moon">☾</span>空室と会員価格を探す';
let cur = null, timer = null, started = 0;

const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); };
const nightsOf = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000);
// チェックインを変えたら、チェックアウトがそれ以前なら翌日に合わせる（泊数を保つ）
let lastIn = null;
function syncOut(){
  const ci = document.getElementById('date').value, el = document.getElementById('checkout');
  if (!ci) return;
  const n = lastIn && el.value ? Math.max(1, nightsOf(lastIn, el.value)) : 1;
  el.value = addDays(ci, n); el.min = addDays(ci, 1); lastIn = ci;
  showNights();
}
function showNights(){
  const ci = document.getElementById('date').value, co = document.getElementById('checkout').value;
  const n = ci && co ? nightsOf(ci, co) : 0;
  document.getElementById('nights').textContent = n >= 1 ? n + '泊' : '日付を確認';
}
function saveAlt(){ try { localStorage.setItem('cmp_show_nr', document.getElementById('showAlt').checked ? '1' : '0'); } catch(e) {} }

async function go(){
  const date = document.getElementById('date').value, checkout = document.getElementById('checkout').value;
  const adults = document.getElementById('adults').value;
  if (!date || !checkout) return;
  const nights = nightsOf(date, checkout);
  if (nights < 1 || nights > 14) { cur = {invalid:'チェックアウト日はチェックインの翌日〜14泊以内にしてください。'}; return render(); }
  try { localStorage.setItem('cmp_adults', adults); } catch(e) {}
  clearTimeout(timer);
  setLoading(true);
  cur = {date, checkout, nights, adults, results:{}}; started = Date.now(); render();
  try {
    const cid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const r = await call('cmpRequest', {date, checkout, adults, cid});
    if (r.error) throw new Error(r.error);
    poll(r.id);
  } catch(e) { if (e.fatal) { cur = null; finish(); return showSetup(e.message); } cur.fatal = e.message || String(e); finish(); }
}

async function poll(id){
  try {
    const r = await call('cmpResult', {id});
    if (r.error) { cur.fatal = r.error; return finish(); }
    cur = r; render();
    if (r.done) return finish();
    if (Date.now() - started > 120000) { cur.fatal = '2分以内に取得できませんでした。'; return finish(); }
  } catch(e) {}
  timer = setTimeout(() => poll(id), 1200);
}

function finish(){ setLoading(false); render(); }

// 取得中はボタンを「取得中…」にし、経過秒数を1秒ごとに更新する
let loading = false, ticker = null, finishedSec = 0;
function setLoading(on){
  loading = on;
  const b = document.getElementById('go');
  b.disabled = on;
  b.innerHTML = on ? '<span class="spin"></span>取得中…' : BTN_IDLE;
  clearInterval(ticker);
  if (on) ticker = setInterval(() => { const t = document.getElementById('elapsed'); if (t) t.textContent = elapsedText(); }, 1000);
  else finishedSec = Math.round((Date.now() - started) / 1000);
}
const elapsedText = () => Math.round((Date.now() - started) / 1000) + '秒';

function render(){
  const out = document.getElementById('out');
  if (!cur) { out.innerHTML = ''; return; }
  if (cur.invalid) { out.innerHTML = `<div class="card"><div class="err" style="margin:0">${esc(cur.invalid)}</div></div>`; return; }
  const showAlt = document.getElementById('showAlt').checked;
  const wd = s => '日月火水木金土'[new Date(s + 'T00:00:00').getDay()];
  const md = s => Number(s.slice(5,7)) + '/' + Number(s.slice(8,10)) + '（' + wd(s) + '）';
  const nights = cur.nights || 1;
  const doneN = ORDER.filter(k => (cur.results || {})[k]).length;

  let h = `<section class="card"><div class="meta"><span class="when num">${md(cur.date)} → ${cur.checkout ? md(cur.checkout) : ''}</span>
    <span class="sub">${nights}泊・${esc(cur.adults)}名${nights > 1 ? '・滞在合計' : ''}</span></div>`;
  if (loading) {
    const pct = Math.max(6, Math.round(doneN / ORDER.length * 100));
    h += `<div class="prog"><div class="msg"><span><span class="spin" style="color:var(--gold)"></span>取得中… ${doneN} / ${ORDER.length} ホテル</span><span class="t num" id="elapsed">${elapsedText()}</span></div>
      <div class="bar"><div class="fill run" style="width:${pct}%"></div></div>
      <div class="hint">各ホテルの公式サイトに問い合わせています。その日最初の検索は30秒ほどかかります。</div></div>`;
  } else if (doneN && !cur.fatal) {
    h += `<div class="prog"><div class="msg"><span>✓ ${doneN} / ${ORDER.length} ホテルを比較</span><span class="t num">${finishedSec}秒</span></div>
      <div class="bar"><div class="fill" style="width:100%"></div></div></div>`;
  }
  h += '<div class="chips">';
  ORDER.forEach(k => {
    const r = (cur.results || {})[k], dot = `<span class="dot" style="background:${COLORS[k]}"></span>`;
    if (!r) h += `<span class="chip wait">${loading ? '<span class="spin"></span>' : dot}${SHORT[k]}</span>`;
    else if (r.error && !r.offers.length) h += `<span class="chip ng">${dot}${SHORT[k]}・${esc(r.error)}</span>`;
    else h += `<span class="chip ok">${dot}${SHORT[k]} <span class="s num">${r.sec}s</span></span>`;
  });
  h += '</div>';
  if (cur.fatal) h += `<div class="err">${esc(cur.fatal)}</div>`;
  if (cur.worker_alive === false && !cur.done) h += `<div class="err">自宅PCの取得プログラムが応答していません（PCの電源・ネット接続を確認してください）。</div>`;
  h += '</section>';

  let offers = [];
  Object.values(cur.results || {}).forEach(r => (r.offers || []).forEach(o => offers.push(Object.assign({hotel:r.hotel}, o))));
  offers.sort((a,b) => a.pay - b.pay);
  const main = offers.filter(o => !o.alt);
  const min = main.length ? main[0].pay : 0;
  // 順位は返金可（基本）で付け、返金不可の安いプランは同じ部屋の直下に添える
  const list = [];
  main.forEach(m => {
    list.push(m);
    if (showAlt) offers.filter(o => o.alt && o.hotel === m.hotel && o.target === m.target).forEach(o => list.push(o));
  });
  if (list.length) {
    h += '<div class="list">';
    let rank = 0;
    list.forEach(o => {
      const isBest = !o.alt && o.pay === min;
      if (!o.alt) rank++;
      const parent = o.alt ? list.find(m => !m.alt && m.hotel === o.hotel && m.target === o.target) : null;
      const sub = o.alt ? `返金可より${yen(parent.pay - o.pay)}安い` : (o.pay > min && min ? `最安 +${yen(o.pay - min)}` : '');
      h += `<article class="offer${isBest ? ' best' : ''}${o.alt ? ' alt' : ''}">
        ${isBest ? '<span class="best-badge">BEST</span>' : ''}
        <div class="rk serif num">${o.alt ? '↳' : rank}</div>
        <div class="hotel"><span class="dot" style="background:${COLORS[o.hotel]}"></span>${esc(NAMES[o.hotel])}</div>
        <div class="price"><div class="p serif num">${yen(o.pay)}</div>
          ${nights > 1 ? `<div class="per num">1泊 ${yen(Math.round(o.pay / nights))}</div>` : ''}
          ${sub ? `<div class="diff num">${sub}</div>` : ''}</div>
        <div class="room">${esc(o.label)}</div>
        <div class="tags">${o.refundable === false ? '<span class="tag nr">返金不可</span>' : '<span class="tag ok">返金可</span>'}${o.meal ? '<span class="tag meal">朝食付き</span>' : ''}</div>
        <div class="plan">${esc(o.plan)}${o.note ? '<br>' + esc(o.note) : ''}</div>
        <div class="foot"><a href="${esc(o.url)}" target="_blank" rel="noopener">予約ページへ →</a></div>
      </article>`;
    });
    h += '</div>';
  } else if (!loading && doneN) {
    h += '<div class="card empty">対象の部屋はすべて満室か、条件に合うプランがありませんでした。</div>';
  }
  out.innerHTML = h;
}

// 初期化は全ての定義の後で行う（const/let を定義前に使うとスクリプト全体が止まるため）
(function init(){
  document.getElementById('go').innerHTML = BTN_IDLE;
  const t = new Date(Date.now() + 9*3600e3 + 86400e3);
  document.getElementById('date').value = t.toISOString().slice(0,10);
  syncOut();
  try { const a = localStorage.getItem('cmp_adults'); if (a) document.getElementById('adults').value = a; } catch(e) {}
  try { document.getElementById('showAlt').checked = localStorage.getItem('cmp_show_nr') === '1'; } catch(e) {}
})();

function showSetup(msg){
  document.getElementById('out').innerHTML = `<section class="card"><div class="meta"><span class="when">合言葉の設定</span></div>
    <p class="sub" style="margin:8px 0 10px">${msg || '最初に一度だけ、合言葉を設定してください（お知らせしたリンクを開けば自動で設定されます）。'}</p>
    <div class="row2" style="grid-template-columns:minmax(0,1fr) 96px;margin-top:0">
      <input id="kin" type="password" autocomplete="off" placeholder="合言葉" style="width:100%;font:inherit;padding:11px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);min-height:46px">
      <button class="go" onclick="saveKey()">設定</button></div></section>`;
}
function saveKey(){
  const v = (document.getElementById('kin').value || '').trim().replace(/^.*k=/, '');
  if (!/^[0-9a-f]{20,}$/i.test(v)) return showSetup('合言葉の形式が正しくありません。');
  K = v; try { localStorage.setItem('yoiyado_k', K); } catch(e) {}
  document.getElementById('out').innerHTML = '';
}
if (!K) showSetup();
</script>
