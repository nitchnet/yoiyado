<style>
:root{
  --bg:#f4f1ea;--bg2:#ece7dc;--card:#fffdf9;--ink:#1c2233;--sub:#6d6a64;--line:#e4ddcf;
  --night:#1f2a44;--night2:#2d3b5e;--gold:#b8893a;--gold-soft:#f3e7cf;
  --ok:#2f7d5b;--ok-bg:#e5f2ea;--warn:#b0462f;--warn-bg:#fbebe5;
  --shadow:0 1px 2px rgba(28,34,51,.05),0 6px 20px rgba(28,34,51,.06);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1422;--bg2:#141b2d;--card:#182033;--ink:#ece8df;--sub:#9aa0ae;--line:#2a3349;
  --night:#0b1020;--night2:#1d2742;--gold:#d8b06a;--gold-soft:#3a3221;
  --ok:#6cc79c;--ok-bg:#183126;--warn:#f0957a;--warn-bg:#3a231d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
.num{font-variant-numeric:tabular-nums}
.hero{background:radial-gradient(120% 140% at 85% -20%,#3b4c78 0%,var(--night2) 38%,var(--night) 100%);color:#f3eee3;padding:22px 16px 74px;position:relative;overflow:hidden}
.ttl{max-width:720px;margin:14px auto 0;position:relative;z-index:1}
.ttl h1{margin:0;font-size:26px;letter-spacing:.1em;font-weight:700}
.ttl p{margin:6px 0 0;font-size:12.5px;color:#c9cbd6;letter-spacing:.03em}
main{max-width:720px;margin:-56px auto 0;padding:0 14px 36px;position:relative;z-index:2}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum .k{font-size:11.5px;color:var(--sub);letter-spacing:.04em}
.sum .v{font-size:22px;font-weight:700;line-height:1.2}
.sum .v small{font-size:12px;font-weight:600;color:var(--sub);margin-left:2px}
.sum > div{min-width:0}
.sum .avg{font-size:11px;color:var(--sub);margin-top:1px;white-space:nowrap}
.sum .v.money{font-size:clamp(15px,4.6vw,22px);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex:none;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px 3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.filters button{font:inherit;font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--sub);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--night2);color:#fff;border-color:var(--night2)}
@media (prefers-color-scheme: dark){.filters button[aria-pressed="true"]{background:var(--gold);color:#1a1f2e;border-color:var(--gold)}}
.updated{font-size:11.5px;color:var(--sub);margin-top:10px}
.filters + .sum{margin-top:12px}
.filters .cxb{margin-left:auto;font-size:11.5px;padding:4px 10px}
.sub2{font-size:12px;color:var(--sub);margin-top:4px}
.sub2:empty{display:none}
details.pm > summary{cursor:pointer;list-style:none}
details.pm > summary::-webkit-details-marker{display:none}
details.pm > summary > span:first-child::after{content:' ▸';color:var(--sub);font-size:11px;font-weight:500}
details.pm[open] > summary > span:first-child::after{content:' ▾'}
details.pm > summary{margin:10px 4px 6px;color:var(--sub)}
.month{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px;font-weight:700}
.month .s{font-size:12px;color:var(--sub);font-weight:500}
.bk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:2px 10px;align-items:start}
.bk.cx{opacity:.55}
.hb{flex:none;width:40px;height:40px;border-radius:9px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;color:#f6efe2;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);line-height:1;letter-spacing:.06em;margin-right:2px}
.hb b{font:600 9.5px/1 Georgia,"Times New Roman",serif;letter-spacing:.08em}.hb b.sm{font-size:7.5px}
.hb i{font:500 6px/1 -apple-system,"Helvetica Neue",Arial,sans-serif;font-style:normal;letter-spacing:.14em;margin-top:3px;opacity:.85}
.hb.hb0{font-size:12px;font-weight:700}
.bk .d{font-weight:700;line-height:1.25}
.bk .d small{display:block;font-size:11px;color:var(--sub);font-weight:500;white-space:nowrap}
.bk .h{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;min-width:0}
.bk .r{font-weight:600;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.bk .p{font-size:12px;color:var(--sub);overflow-wrap:anywhere}
.bk .pay{text-align:right;font-weight:700;font-size:16px;white-space:nowrap}
.bk .pay small{display:block;font-size:11px;color:var(--sub);font-weight:500}
.tag{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:6px;font-weight:700;margin-left:4px;vertical-align:1px}
.tag.ok{color:var(--ok);background:var(--ok-bg)}
.tag.nr{color:var(--warn);background:var(--warn-bg)}
.tag.cx{color:var(--sub);background:var(--bg2)}
.tag.ch{color:var(--sub);background:var(--bg2);font-weight:600}
.bk .w{grid-column:2/4;font-size:12px;color:var(--sub);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px}
.bk .w .tm{flex-basis:100%;color:var(--ink)}
.tag.ot{color:var(--sub);background:var(--bg2);font-weight:500}
.bk.save{border:1.5px solid var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--card) 75%)}
.bk .sv{grid-column:1/4;margin-top:6px;padding:7px 10px;border-radius:10px;background:var(--card);border:1px dashed var(--gold);font-size:12.5px;line-height:1.5}
.bk .sv b{color:var(--gold)}
.bk.cpw{border-color:var(--warn)}
.sum2.dup{background:var(--warn-bg);color:var(--warn)}
.sum2.dup b{color:inherit}
.bk .cw{grid-column:1/4;margin-top:6px;padding:6px 10px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:12px;line-height:1.5}
.bk .cw a{color:inherit;font-weight:700}
.bk .sv a{color:inherit;font-weight:700}
.bk .sv.tr small{display:block;color:var(--sub);font-size:11px;margin-top:2px}
.bk .sv.nr small{display:block;color:var(--sub);font-size:11px;margin-top:2px}
.nrset select{font:inherit;font-size:11.5px;padding:0 2px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.bk .lk{grid-column:2/4;display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;margin-top:3px}
.bk .lk a{color:var(--sub)}
.bk .lk .cpy{font:inherit;font-size:11.5px;padding:0;border:0;background:none;color:var(--sub);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
#mailov{position:fixed;inset:0;background:rgba(10,14,24,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
#mailov .mv-box{background:var(--card);color:var(--ink);width:100%;max-width:720px;max-height:88vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
@media (min-width:760px){#mailov{align-items:center}#mailov .mv-box{border-radius:16px}}
#mailov .mv-hd{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:14px 16px 4px}
#mailov .mv-hd b{font-size:14px;line-height:1.4}
#mailov .mv-hd button{flex:none;font:inherit;font-size:12.5px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
#mailov .mv-meta{font-size:11.5px;color:var(--sub);padding:0 16px 8px;border-bottom:1px solid var(--line)}
#mailov .mv-body{overflow:auto;padding:4px 16px 24px}
#mailov pre{margin:0;padding:8px 0 0;white-space:pre-wrap;word-break:break-word;font:12.5px/1.6 inherit;font-family:inherit}
.dt{display:grid;gap:0}
.dt-r{display:grid;grid-template-columns:6.5em 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.55}
.dt-k{color:var(--sub);font-size:12px;padding-top:1px}
.dt-v{min-width:0;overflow-wrap:anywhere}.dt-v small{display:block;color:var(--sub);font-size:11.5px}.dt-v.sub{color:var(--sub)}
.dt-bs{display:flex;flex-direction:column;gap:8px;margin:14px 0 6px}
.dt-b{display:block;text-align:center;font:inherit;font-size:14px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;cursor:pointer}
.dt-b:first-child{background:var(--ink);color:var(--card);border-color:var(--ink)}
.dt-b.warn{color:#c0392b;border-color:#e3b3ac}
.dt-n{font-size:12px;color:var(--sub);margin:6px 0}.dt-g{color:inherit}
.dt-m{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}.dt-m summary{cursor:pointer;font-size:13px;color:var(--sub)}
.tag.pd{background:#fdecc8;color:#8a5a00}
.dt-pd{margin:4px 0 10px;padding:10px 12px;border-radius:12px;background:#fdf3e1;color:#5a4300;font-size:13px;line-height:1.55}
.dt-pd .dt-b{margin-top:8px;font-size:13px}
.today{margin:0 0 12px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.today .td-h{font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:600}.today .td-s{font-weight:400;margin-left:4px}
.today .td-i{font-size:13.5px;line-height:1.5;padding:4px 0;border-top:1px dashed var(--line)}.today .td-i:first-of-type{border-top:0}
.today .td-i a{color:inherit;text-decoration:none}.today .td-i.info{color:var(--sub)}.today .td-i.none{color:var(--sub)}
.today .td-m{font-size:11.5px;color:var(--sub);margin-top:2px}
.bk.flash{outline:2px solid #d8b06a;outline-offset:2px;transition:outline-color .4s}
.trt{padding:12px 14px}
.trt summary{display:flex;justify-content:space-between;align-items:baseline;gap:8px;cursor:pointer;font-weight:700;list-style:none}
.trt summary::-webkit-details-marker{display:none}
.trt summary .s{font-size:12px;color:var(--sub);font-weight:500;white-space:nowrap;margin-left:auto}
.trt summary span:first-child{white-space:nowrap}
.trt summary span:first-child::after{content:' ▸';color:var(--sub);font-size:11px}
.trt[open] summary span:first-child::after{content:' ▾'}
.trs{font-size:12px;color:var(--sub);margin-top:8px}
.trs b{color:var(--ink)}
.trb{display:flex;gap:4px;margin:8px 0}
.trb button{font:inherit;font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--sub);cursor:pointer}
.trb button[aria-pressed="true"]{background:var(--night2);color:#fff;border-color:var(--night2)}
@media (prefers-color-scheme: dark){.trb button[aria-pressed="true"]{background:var(--gold);color:#1a1f2e;border-color:var(--gold)}}
.trg{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:4px 10px;font-size:12.5px;align-items:baseline}
.trg .th{font-size:11px;color:var(--sub);border-bottom:1px solid var(--line);padding-bottom:2px}
.trg .r{text-align:right}
.trg small{display:block;font-size:10.5px;color:var(--sub)}
.trg div.r small{display:block}
.trg .ok{color:var(--ok);font-weight:700}
.trg a{color:inherit}
.sum2{margin-top:10px;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--gold-soft)}
.sum2 b{color:var(--gold)}
.err{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:10px}
footer{max-width:720px;margin:0 auto;padding:0 16px 28px;text-align:center;font-size:11px;color:var(--sub);letter-spacing:.06em}
@media (max-width:380px){.bk{grid-template-columns:64px minmax(0,1fr) auto}.sum .v{font-size:19px}}

<script>
const GAS = "https://script.google.com/macros/s/AKfycbyXS4tQgx8U95EG5EUJd3H47_saO_Ny35XWZBWxyNY-2ck8QBLOmgAzSm6HtN7twnRXaFGf/exec";
const NAMES = {keio:'京王プラザ', iprefer:'京王プラザ（I Prefer）', newotani:'ニューオータニ ザ・メイン（I Prefer）', groove:'ホテルグルーヴ', hilton:'ヒルトン東京', hyatt:'ハイアット リージェンシー', kimpton:'キンプトン新宿', bellustar:'BELLUSTAR TOKYO',
  chinzanso:'ホテル椿山荘東京', capitol:'ザ・キャピトルホテル東急', yuen_daita:'由縁別邸 代田', aoyama_grand:'THE AOYAMA GRAND HOTEL', holic_ebisu:'恵比寿ホリックホテル',
  ana_ic:'ANAインターコンチネンタル東京', ic_tokyobay:'インターコンチネンタル東京ベイ', cerulean:'セルリアンタワー東急ホテル', westin:'ウェスティンホテル東京'};
// 料金比較・値下がりチェックの対象外（予約の記録だけ載せる）
const OTHER = new Set(['chinzanso','capitol','yuen_daita','aoyama_grand','holic_ebisu','ana_ic','ic_tokyobay','cerulean','westin','park_hyatt','grand_hyatt','andaz','hyatt_centric','hyatt_other']);
let OTHER_COLOR;
const COLORS = {keio:'#7a5c9e', iprefer:'#a07cc5', newotani:'#9b6b3f', groove:'#d0603c', hilton:'#2f5fa8', hyatt:'#5b8c9c', kimpton:'#3f8a5f', bellustar:'#8a7a3a'};
OTHER_COLOR = '#9a9a9a';
// ホテルの札（ロゴ風の小さな四角。本物のロゴは商標なので使わず、名前の文字だけで作る・2026-10-24）
// [上の行, 下の行, 地の色]
const BADGE = {
  hyatt: ['HYATT', 'REGENCY', '#2c4a5a'], park_hyatt: ['PARK', 'HYATT', '#3a3a3a'], grand_hyatt: ['GRAND', 'HYATT', '#5a4632'],
  andaz: ['ANDAZ', '', '#6b3f5e'], hyatt_centric: ['HYATT', 'CENTRIC', '#2c4a5a'], hyatt_other: ['HYATT', '', '#2c4a5a'],
  keio: ['KEIO', 'PLAZA', '#5b4380'], iprefer: ['KEIO', 'PLAZA', '#7d5fa6'], newotani: ['NEW', 'OTANI', '#7a5531'],
  hilton: ['Hilton', 'TOKYO', '#1d4f91'], groove: ['GROOVE', 'SHINJUKU', '#b0502f'], bellustar: ['BELLU', 'STAR', '#6e6330'],
  kimpton: ['KIMPTON', 'SHINJUKU', '#2f6b4a'], chinzanso: ['椿山荘', '', '#3f5a3a'], capitol: ['CAPITOL', 'TOKYU', '#4b4b4b'],
  ana_ic: ['ANA', 'IC', '#2a3e66'], ic_tokyobay: ['IC', 'BAY', '#2a3e66'], cerulean: ['CERU', 'LEAN', '#2f5f8a'],
  westin: ['WESTIN', 'TOKYO', '#4a4a3a'], yuen_daita: ['由縁', '代田', '#6a5a44'], aoyama_grand: ['AOYAMA', 'GRAND', '#3c3c3c'],
  holic_ebisu: ['HOLIC', 'EBISU', '#5a4a6a'],
};
function badge(r){
  const b = BADGE[r.hotel];
  if (!b) return `<span class="hb hb0" style="background:${COLORS[r.hotel] || OTHER_COLOR}">${esc((NAMES[r.hotel] || r.hotel_name || '?').slice(0, 2))}</span>`;
  return `<span class="hb" style="background:${b[2]}"><b${b[0].length > 6 ? ' class="sm"' : ''}>${esc(b[0])}</b>${b[1] ? `<i>${esc(b[1])}</i>` : ''}</span>`;
}
const yen = n => '¥' + Number(n).toLocaleString('ja-JP');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wd = s => '日月火水木金土'[new Date(s + 'T00:00:00').getDay()];
const md = s => Number(s.slice(5,7)) + '/' + Number(s.slice(8,10));
let K = '', data = null, view = 'future', STALE = false;
try { K = localStorage.getItem('yoiyado_k') || ''; } catch(e) {}

// 予約台帳は毎朝1回しか変わらないので、この端末に控えを置いてまず即座に表示し、裏で最新を取りに行って変わっていれば差し替える
// （控えは会員ステータスのページと共用）
const LEDGER_MEMO = 'yoiyado_ledger';
async function load(){
  if (!K) { document.getElementById('summary').innerHTML = '<div class="err">合言葉が設定されていません。料金比較のページで合言葉を設定してから開いてください。</div>'; return; }
  let memo = null;
  try { memo = localStorage.getItem(LEDGER_MEMO); } catch(e) {}
  if (memo) { try { data = JSON.parse(memo); render(); } catch(e) { memo = null; } }
  for (let i = 0; i < 5; i++) {
    try {
      const r = await fetch(GAS + '?api=ledger&k=' + encodeURIComponent(K), {credentials: 'omit', cache: 'no-store'});
      const t = await r.text();
      if (t.trim().startsWith('{')) {
        const j = JSON.parse(t); if (j.error) break;
        try { localStorage.setItem(LEDGER_MEMO, t); } catch(e) {}
        if (t !== memo) { data = j; render(); }
        return;
      }
    } catch(e) {}
    await new Promise(res => setTimeout(res, 1200 * (i + 1)));
  }
  if (!data) document.getElementById('summary').innerHTML = '<div class="err">予約一覧を読み込めませんでした。少し時間をおいて開き直してください。</div>';
  else { STALE = true; render(); }
}

// 2026-10-12 年ごとの表示に変更：年を選ぶと、その年の件数・泊数・合計（泊まり済み＋予定）とホテル別の泊数を出す
let yearSel = null, showCx = false;
async function setNrDays(v){
  data.settings = Object.assign({}, data.settings, {hyatt_nr_days: Number(v)});
  try {
    const r = await fetch(GAS + '?api=settingSet&name=hyatt_nr_days&value=' + encodeURIComponent(v) + '&k=' + encodeURIComponent(K), {credentials: 'omit', cache: 'no-store'});
    const j = JSON.parse(await r.text());
    if (!j.ok) throw new Error(j.error || 'failed');
  } catch(e) { alert('保存できませんでした。少し時間をおいてもう一度お試しください。'); }
}

// ハイアット振り替えの判断表（2026-10-17）：ハイアット以外の予約と、同じ日のハイアット（キング・会員料金・返金可）の料金・差額。
// 毎朝7時台の照会（各日2日に1回）の結果。並べ替えと「あと何泊・追加いくら」
let trSort = 'diff', trOpen = false;
try { trSort = localStorage.getItem('yoiyado_tr_sort') || 'diff'; trOpen = localStorage.getItem('yoiyado_tr_open') === '1'; } catch(e) {}
function setTrSort(v){ trSort = v; try { localStorage.setItem('yoiyado_tr_sort', v); } catch(e) {} render(); }
function trToggle(el){ trOpen = el.open; try { localStorage.setItem('yoiyado_tr_open', el.open ? '1' : '0'); } catch(e) {} }
function transferTable(Y, today){
  const hp = data.hyatt || {}, st = data.settings || {}, target = Number(st.hyatt_target || 63);
  const live = new Map((data.rows || []).filter(r => r.status === 'booked').map(r => [r.key, r]));
  const rows = (hp.transfer || []).filter(t => String(t.year) === String(Y) && live.has(t.k) && t.checkin >= today);
  if (!rows.length) return '';
  const hy = (data.rows || []).filter(r => r.status === 'booked' && HYATT_HOTELS.includes(r.hotel) && r.channel === '公式' && r.checkin && r.checkin.slice(0, 4) === String(Y) && r.checkin <= `${Y}-09-30`);
  const nights = hy.reduce((a, r) => a + r.nights, 0), rest = Math.max(0, target - nights);
  const priced = rows.filter(t => t.pay != null && t.diff != null).sort((a, b) => a.diff - b.diff);
  const by930 = priced.filter(t => t.checkin <= `${Y}-09-30`);
  const sumN = (list, n) => list.slice(0, n).reduce((a, t) => a + t.diff, 0);
  const wd = by930.filter(t => t.weekday !== false);
  const HN = {keio: '京王', iprefer: '京王IP', groove: 'グルーヴ', newotani: 'オータニ'};
  const W = '日月火水木金土', dow = s => W[new Date(s + 'T00:00:00+09:00').getDay()];
  const list = trSort === 'date' ? [...rows].sort((a, b) => a.checkin < b.checkin ? -1 : 1)
    : [...priced, ...rows.filter(t => t.pay == null || t.diff == null)];
  const sign = n => n >= 0 ? '+' + yen(n) : '−' + yen(-n);
  return `<details class="card trt"${trOpen ? ' open' : ''} ontoggle="trToggle(this)">
    <summary><span>ハイアット振り替えの判断表</span><span class="s">あと${rest}泊</span></summary>
    <div class="trs">${rest ? `差額の小さい順に<b>${Math.min(rest, by930.length)}泊</b>振り替えると <b>${sign(sumN(by930, rest))}</b>（平日だけなら ${sign(sumN(wd, rest))}）` : '<b>9/30までの目標に届いています</b>'}
　${Y}年9/30までのハイアット ${nights}泊／目標${target}泊</div>
    <div class="trb" role="group" aria-label="並べ替え">${[['diff', '差額順'], ['date', '日付順']].map(([v, l]) =>
      `<button type="button" aria-pressed="${trSort === v}" onclick="setTrSort('${v}')">${l}</button>`).join('')}</div>
    <div class="trg"><div class="th">日付</div><div class="th">今の予約</div><div class="th r">ハイアット</div><div class="th r">差額</div>
    ${list.map(t => `<div class="${t.ok ? 'ok' : ''}">${md(t.checkin)}<small>（${dow(t.checkin)}）</small></div>
      <div>${esc(HN[t.hotel] || t.hotel)} <span class="num">${yen(t.booked_pay)}</span></div>
      <div class="r num">${t.pay != null ? `<a href="${esc(t.url || '#')}" target="_blank" rel="noopener">${yen(t.pay)}</a>` : `<small>${esc(t.reason || '未確認')}</small>`}</div>
      <div class="r num ${t.diff != null && t.diff <= Number(st.hyatt_margin || 5000) ? 'ok' : ''}">${t.diff != null ? sign(t.diff) : '—'}<small>${md(t.checked || today)}</small></div>`).join('')}</div>
    <div class="trs" style="margin-top:6px">金額は税・サ・宿泊税込みの滞在合計。ハイアットはキング・会員料金・返金可。各日を2日に1回調べています（右下は調べた日）。緑は+${yen(Number(st.hyatt_margin || 5000))}以内</div>
  </details>`;
}

// 予約の詳細（2026-10-17）：どのホテルも同じ並びで、予約内容・支払い・キャンセル規定と、変更・キャンセルのリンクを出す。
// リンクは予約確認メールに載っているもの（押したときだけ開く）。メールにリンクがない経路は、サイトの予約確認の入口＋予約番号のコピー。
const SITE = {'一休': ['一休の予約確認', 'https://www.ikyu.com/'], 'Expedia': ['エクスペディアの旅程', 'https://www.expedia.co.jp/trips'],
              'I Prefer': ['I Preferの予約確認', 'https://www.phgsecure.com/ibe/reservationbrandredirect.ashx?brandcode=PH']};
const MAILC = {};
let DSEQ = 0;
async function getMail(id){
  if (MAILC[id]) return MAILC[id];
  const r = await fetch(GAS + '?api=mail&id=' + encodeURIComponent(id) + '&k=' + encodeURIComponent(K), {credentials: 'omit', cache: 'no-store'});
  const j = JSON.parse(await r.text());
  if (j.error) throw new Error(j.error);
  return (MAILC[id] = j);
}
function mailOv(){
  let ov = document.getElementById('mailov');
  if (!ov) {
    ov = document.createElement('div'); ov.id = 'mailov';
    ov.innerHTML = '<div class="mv-box" role="dialog" aria-modal="true" aria-labelledby="mvsub"><div class="mv-hd"><b id="mvsub"></b><button type="button" onclick="closeMail()" aria-label="閉じる">閉じる</button></div><div class="mv-meta" id="mvmeta"></div><div class="mv-body" id="mvbody"></div></div>';
    ov.addEventListener('click', e => { if (e.target === ov) closeMail(); });
    document.body.appendChild(ov);
  }
  ov.style.display = 'flex'; document.documentElement.style.overflow = 'hidden';
  // スマホの「戻る」で詳細を閉じる（2026-10-24）
  if (!(history.state && history.state.yd)) history.pushState({yd: 1}, '');
  return ov;
}
const telNo = s => { const d = String(s || '').replace(/[^\d+]/g, ''); return d.startsWith('81') ? '0' + d.slice(2) : d.startsWith('+81') ? '0' + d.slice(3) : d; };
async function showDetail(key){
  const r = (data.rows || []).find(x => x.key === key); if (!r) return;
  mailOv();
  const seq = ++DSEQ;  // 読み込み中に別の予約を開いたり閉じたりしたら、遅れて届いた応答は捨てる
  const conf = r.conf || r.key.split(':').pop(), cx = r.status !== 'booked';
  document.getElementById('mvsub').textContent = `${md(r.checkin)}（${wd(r.checkin)}）${NAMES[r.hotel] || r.hotel_name || r.hotel}`;
  document.getElementById('mvmeta').textContent = `${r.channel || '公式'}　予約番号 ${conf}`;
  const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  const st = !cx && r.checkout > today ? stayTimes(r, currentTiers(data.manual), ghaProjection(data.rows || [])) : null;
  const row = (k, v) => v ? `<div class="dt-r"><div class="dt-k">${k}</div><div class="dt-v">${v}</div></div>` : '';
  const base = row('状態', cx ? '<span class="tag cx">キャンセル</span>' : r.refundable ? '<span class="tag ok">返金可</span>' : '<span class="tag nr">返金不可</span>')
    + row('日程', `${md(r.checkin)}（${wd(r.checkin)}）〜 ${md(r.checkout)}（${wd(r.checkout)}）・${r.nights}泊・${r.adults}名`)
    + row('イン／アウト', st && st.co ? `${esc(st.ci)} ／ ${esc(st.co)}${st.why ? `<small>（${esc(st.why)}）</small>` : ''}` : '')
    + row('部屋', esc(r.room || '')) + row('プラン', esc(r.plan || ''))
    + row('金額', r.pay ? `${yen(r.pay)}${r.nights > 1 ? `<small>（1泊 ${yen(Math.round(r.pay / r.nights))}）</small>` : ''}<small>税・サ・宿泊税込み</small>` : '—')
    + row('無料キャンセル', !cx && r.free_cancel_until ? `${md(r.free_cancel_until)}（${wd(r.free_cancel_until)}）まで` : '');
  const bodyEl = document.getElementById('mvbody');
  bodyEl.innerHTML = `<div class="dt">${base}<div class="dt-r"><div class="dt-k">メールから</div><div class="dt-v sub">読み込み中…</div></div></div>`;
  let j = null;
  try { if (r.mail_id) j = await getMail(r.mail_id); } catch(e) {}
  if (seq !== DSEQ) return;
  const L = (j && j.links) || {}, btn = [];
  const a = (u, t, cls) => !/^https:\/\//.test(String(u)) ? '' : `<a class="dt-b${cls ? ' ' + cls : ''}" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)} →</a>`;
  const PP = {groove: ['PRGTK', 'PR'], bellustar: ['PPBTK', 'PP']};
  if (!cx) {
    if (L.manage && /^https:\/\//.test(L.manage.url)) btn.push(a(L.manage.url, '予約の確認・変更・キャンセル'));
    else if (PP[r.hotel] && r.channel === '公式') btn.push(a(`https://www.panpacific.com/content/pphg-revamp/ja/booking/view.html?acc-confirmation=${encodeURIComponent(conf)}&ppcode=${PP[r.hotel][0]}&brand=${PP[r.hotel][1]}`, '予約の確認・変更・キャンセル'));
    else {
      if (L.modify) btn.push(a(L.modify.url, '予約の確認・変更'));
      else if (L.view) btn.push(a(L.view.url, '予約の確認'));
      if (L.cancel) btn.push(a(L.cancel.url, 'キャンセル', 'warn'));
    }
    if (!btn.length && SITE[r.channel]) btn.push(a(SITE[r.channel][1], SITE[r.channel][0]));
  }
  const tel = j && j.phone ? telNo(j.phone) : '';
  const telShow = j && j.phone ? String(j.phone).replace(/^\+?81[-\s]?(\d)/, '0$1') : '';
  if (tel) btn.push(`<a class="dt-b" href="tel:${esc(tel)}">電話 ${esc(telShow)}</a>`);
  btn.push(`<button type="button" class="dt-b" onclick="copyConf(this, ${esc(JSON.stringify(conf))})">予約番号をコピー</button>`);
  const pend = !cx && r.cx_group ? (data.rows || []).filter(x => x.cx_group === r.cx_group && x.status === 'booked') : [];
  const pendBox = pend.length ? `<div class="dt-pd"><b>キャンセルの照合保留</b>：同じホテル・同じ日程の予約が${pend.length}件あり、届いたキャンセルメールがどれのものか判別できません。ホテルの予約確認で確かめて、キャンセルされた予約を選んでください。
    ${pend.map(x => `<button type="button" class="dt-b" onclick="resolveCx(this, ${esc(JSON.stringify(x.cx_group))}, ${esc(JSON.stringify(x.key))})">予約番号 ${esc(x.conf || x.key.split(':').pop())}${x.pay ? '・' + yen(x.pay) : ''} がキャンセルされた</button>`).join('')}</div>` : '';
  const nw = !cx && r.refundable && r.checkout > today ? `<button type="button" class="dt-b nwb" onclick="setNoWatch(this, ${esc(JSON.stringify(r.key))}, ${r.nowatch ? 0 : 1})">${r.nowatch ? '値下がり・振り替えの監視を再開する' : 'この予約は値下がり・振り替えを監視しない'}</button>` : '';
  // ほかのホテルと比べる（料金比較に日程を入れて開く。検索は料金比較で押す・A3）
  if (!cx && r.checkout > today) btn.push(`<a class="dt-b" href="./?in=${r.checkin}&out=${r.checkout}&a=${r.adults || 2}">この日程でほかのホテルと比べる</a>`);
  const more = j ? row('支払い', esc(j.pay_ja || j.pay || '')) + row('キャンセル規定', esc(j.cancel_ja || j.cancel || '')) : '';
  // 原典：パソコンではGmailでそのメールを開ける（スマホのGmailはこのリンクを受け付けないので「元のメールを見る」で）
  const gm = !TOUCH && data.mail_acct ? `<a class="dt-g" href="https://mail.google.com/mail/?authuser=${encodeURIComponent(data.mail_acct).replace('%40', '@')}#${r.mail_id ? 'all/' + encodeURIComponent(r.mail_id) : 'search/' + encodeURIComponent('"' + conf + '"')}" target="_blank" rel="noopener">Gmailで開く →</a>` : '';
  bodyEl.innerHTML = `${pendBox}<div class="dt">${base}</div>
    ${btn.length ? `<div class="dt-bs">${btn.join('')}</div>` : ''}
    ${more ? `<div class="dt">${more}</div>` : ''}
    ${spark(r)}
    ${!cx && !L.manage && !L.modify && !L.cancel && !(PP[r.hotel] && r.channel === '公式') ? `<div class="dt-n">予約メールに変更・キャンセルのリンクがありません。${SITE[r.channel] ? 'サイトの予約確認から、予約番号で探してください。' : 'ホテルに電話するか、予約したサイトから手続きしてください。'}</div>` : ''}
    ${!cx && L.cancel ? '<div class="dt-n">キャンセルはホテルのページで確定するまで行われません。</div>' : ''}
    ${j ? `<details class="dt-m"><summary>元のメールを見る</summary>${gm ? `<div class="dt-n">${gm}</div>` : ''}<div class="mv-meta">${esc(j.subject || '')}<br>${esc(j.from || '')}　${esc(j.date || '')}</div><pre>${esc(j.text || '')}</pre></details>`
        : `<div class="dt-n">${r.mail_id ? '予約メールを読み込めませんでした。少し時間をおいてお試しください。' : 'この予約は予約メールが見つかっていません。'}${gm ? '　' + gm : ''}</div>`}
    ${(j && ((j.cancel_ja && j.cancel_ja !== j.cancel) || (j.pay_ja && j.pay_ja !== j.pay))) ? '<div class="dt-n">英語の規定は日本語に訳して表示しています（正確な文面は元のメールで）。</div>' : ''}
    ${nw ? `<div class="dt-bs" style="margin-top:18px">${nw}</div>` : ''}`;
}
function closeMail(fromPop){
  DSEQ++; const ov = document.getElementById('mailov');
  const open = ov && ov.style.display !== 'none';
  if (ov) ov.style.display = 'none'; document.documentElement.style.overflow = '';
  if (open && !fromPop && history.state && history.state.yd) history.back();

    ${shown.map(x => `<div class="td-i${x.info ? ' info' : ''}">${x.k ? `<a href="#" onclick="goBk(${esc(JSON.stringify(x.k))});return false">${x.t}</a>` : x.href ? `<a href="${esc(x.href)}">${x.t}</a>` : x.t}</div>`).join('')}
    ${acts.length ? (acts.length > 3 ? `<div class="td-m"><a href="#" onclick="todoAll=!todoAll;render();return false">${todoAll ? '3件だけ表示' : `ほか${acts.length - 3}件も表示`}</a></div>` : '') : '<div class="td-i none">今日の操作はありません</div>'}</div>
    ${strip14(future, today)}`;
  let h = (STALE ? `<div class="sum2 dup">⚠ <b>最新の予約データを取得できませんでした</b>。この端末に保存したデータ（台帳の更新 ${fmtT(data.built)}）を表示しています。料金や期限は古い可能性があります</div>` : '') + todayBox + `<div class="filters" role="group" aria-label="表示する年">
      ${years.map(v => `<button type="button" aria-pressed="${v === Y}" onclick="setYear('${v}')">${v}年</button>`).join('')}
      <button type="button" class="cxb" aria-pressed="${showCx}" onclick="toggleCx()">キャンセルも表示</button></div>
    <div class="sum">
      <div><div class="k">${Y}年の予約</div><div class="v num">${yb.length}<small>件</small></div></div>
      <div><div class="k">泊数</div><div class="v num">${nights}<small>泊</small></div></div>
      <div><div class="k">合計</div><div class="v money num serif">${yen(total)}</div>${avg ? `<div class="avg num">1泊平均 ${yen(avg)}</div>` : ''}</div></div>
    <div class="sub2">${dn ? `泊まり済み ${dn}泊・${yen(done.reduce((a, r) => a + (r.pay || 0), 0))}` : ''}${dn && pn ? '　' : ''}${pn ? `これから ${pn}泊・${yen(plan.reduce((a, r) => a + (r.pay || 0), 0))}` : ''}</div>
    <div class="chips" data-noswipe>${Object.entries(byHotel).sort((a, b) => b[1][1] - a[1][1]).map(([k, v]) =>
      `<button type="button" class="chip${hotelFilter === k ? ' on' : ''}" aria-pressed="${hotelFilter === k}" onclick="setHotel('${k}')"><span class="dot" style="background:${COLORS[k] || OTHER_COLOR}"></span>${esc(NAMES[k] || k)} ${v[1]}泊</button>`).join('')}</div>
    ${dupDays.length ? `<div class="sum2 dup">⚠ 重複の可能性：<b>${dupDays.map(d => md(d)).join('、')}</b>（同じホテルで泊まる日が重なる予約があります）</div>` : ''}
    ${saves.length ? `<div class="sum2">取り直すと安くなる予約：<b>${saves.length}件・合計 ${yen(saveTotal)}</b></div>` :
      (Object.keys(W).length ? `<div class="sum2">取り直すと安くなる予約はありません（返金可の予約を毎朝確認しています）</div>` : '')}
    ${(() => { const cc = data.cal_check || {}, m = cc.missing || [], x = cc.extra || [], w = cc.wrong || [];
      const parts = [m.length ? `予約はあるのにカレンダーが空き ${m.map(v => md(v.checkin)).join('、')}` : '',
                     x.length ? `カレンダーに宿泊予定があるのに予約なし ${x.map(v => md(v.checkin)).join('、')}` : '',
                     w.length ? `ホテルが違う ${w.map(v => md(v.checkin)).join('、')}` : ''].filter(Boolean);
      return parts.length ? `<div class="sum2 dup">⚠ <b>カレンダー（P予定）とのずれ</b>：${parts.join('／')}</div>` : ''; })()}
    ${(() => { // 朝の処理の健康状態（2026-10-17）：失敗・未実行を赤く出す
      const hh = data.health || {}, nowJ = new Date(Date.now() + 9 * 3600e3).toISOString(), late = nowJ.slice(11, 16) >= '08:30';
      if (hh.date === today && (hh.problems || []).length)
        return `<div class="sum2 dup">⚠ <b>朝の処理で不具合</b>：${(hh.problems || []).map(esc).join('／')}</div>`;
      if (late && hh.date !== today)
        return `<div class="sum2 dup">⚠ <b>今朝の処理がまだ動いていません</b>（最後に終わったのは ${hh.checked ? md(hh.checked) + ' ' + hh.checked.slice(11, 16) : '不明'}）。自宅PCの電源・スリープを確認してください</div>`;
      return '';
    })()}
    ${hStop ? `<div class="sum2 dup">⚠ <b>ハイアット取得停止中</b>：ボット判定・アクセス制限とみられる応答があったため、手動・自動とも照会を止めています。再開には承認が必要です</div>` : ''}
    <div class="updated">台帳の更新：${fmtT(data.built)}　値下がりチェック：${fmtT(data.watch_checked)}${(data.health || {}).date === today && !((data.health || {}).problems || []).length ? `　朝の処理：正常（${data.health.checked.slice(11, 16)}確認）` : ''}</div>
    <div class="updated nrset">ハイアットの返金不可チェック：チェックインの
      <select aria-label="何日前から" onchange="setNrDays(this.value)">${[3,5,7,10,14,21,30].map(v => `<option value="${v}"${v === nrDays ? ' selected' : ''}>${v}</option>`).join('')}</select>
      日前から（毎朝7時台）</div>`;
  document.getElementById('summary').innerHTML = h;

  const rows = all.filter(r => r.checkin && r.checkin.slice(0, 4) === Y && (showCx || r.status === 'booked') && (!hotelFilter || r.hotel === hotelFilter))
                  .sort((a, b) => a.checkin < b.checkin ? -1 : 1);
  const fbar = hotelFilter ? `<div class="fb"><span>絞り込み中：<b>${esc(NAMES[hotelFilter] || hotelFilter)}</b>・${rows.length}件</span><button type="button" onclick="setHotel('')">すべて表示</button></div>` : '';
  if (!rows.length) { document.getElementById('list').innerHTML = fbar + `<div class="card empty">${Y}年の予約はありません。</div>`; return; }
  const groups = {};
  rows.forEach(r => { const m = r.checkin.slice(0, 7); (groups[m] = groups[m] || []).push(r); });
  let l = fbar;
  const tiers = currentTiers(data.manual), proj = ghaProjection(data.rows || []);
  // 要登録キャンペーンで、まだ「登録済み」にしていないもの（キャンペーンのタブと同じ判定）
  const CW = CPD ? cpWarningsByBooking(CPD.campaigns, data.rows || [], CPD.status) : {};
  Object.keys(groups).sort().forEach(m => {
    const g = groups[m], bk = g.filter(r => r.status === 'booked'), gn = bk.reduce((a, r) => a + r.nights, 0);
    // 月の総額（有効な予約の宿泊税込み合計。ポイント宿泊など金額のない予約は除く）
    const gp = bk.reduce((a, r) => a + (r.pay || 0), 0), np = bk.filter(r => !r.pay).length;
    const head = `<span>${Number(m.slice(0,4))}年${Number(m.slice(5))}月</span><span class="s">${bk.length}件・${gn}泊${gp ? `・${yen(gp)}` : ''}${np ? `（ほか${np}件はポイント等）` : ''}</span>`;
    const past = m < today.slice(0, 7);  // 終わった月は見出し1行にたたむ（押すと開く）
    l += past ? `<details class="pm"><summary class="month">${head}</summary>` : `<div class="month">${head}</div>`;
    g.forEach(r => {
      const cx = r.status !== 'booked', w = W[r.key], sv = !cx && isSave(r) && r.checkout > today;
      const ch = r.channel && r.channel !== '公式' ? `<span class="tag ch">${esc(r.channel)}</span>` : '';
      const free = !cx && r.free_cancel_until ? `<span>無料キャンセル ${md(r.free_cancel_until)}（${wd(r.free_cancel_until)}）まで</span>` : '';
      // 調べた日が今日でなければ「（10/12時点）」のように日付を付ける（ハイアットは毎日は調べないため）
      const wd8 = w && w.checked && w.checked.slice(0, 10) !== today ? `・${md(w.checked)}時点` : '';
      // その予約の確認ページ・予約メールへのリンク（押したときだけ開く）
      const PP = {groove: ['PRGTK', 'PR'], bellustar: ['PPBTK', 'PP']}, conf = r.conf || r.key.split(':').pop();
      // 外部リンク（予約の確認・変更）は予約の詳細の中だけに置き、カードには大きい「詳細」ボタンだけ（押し間違い防止・2026-10-24）
      const evs = !cx ? ((data.eve || {})[r.checkin] || []) : [];
      const evl = evs.length ? `<span class="ev">${evs.slice(0, 2).map(e => `<b>${esc(e.t)}</b> ${esc(e.kind)}${e.place ? `（${esc(e.place)}）` : ''}`).join('　')}</span>` : '<span class="ev"></span>';
      const lk = `<div class="ft">${evl}<button type="button" class="db" onclick="showDetail(${esc(JSON.stringify(r.key))})">詳細</button></div>`;
      // 「今の最安」は予約より安いときだけ（高い料金は判断に使えないため・2026-10-24）
      const wl = !cx && w && w.best_pay && !sv && w.best_pay < r.pay ? `<span>今の最安 ${yen(w.best_pay)}（${esc(w.best_channel)}${wd8}）</span>` : '';
      // いまの資格で使えるチェックイン／アウト（会員ステータスで選んだ資格から）
      const st = !cx && r.checkout > today ? stayTimes(r, tiers, proj) : null;
      const tm = st && st.co ? `<span class="tm">イン ${st.ci}・<b>アウト ${st.co}</b>${st.why ? `（${esc(st.why)}${st.how ? '・' + esc(st.how) : ''}）` : ''}</span>` : '';
      const cw = !cx && CW[r.key] ? CW[r.key] : [];
      const dp = !cx && DUP[r.key] ? DUP[r.key] : [];
      const tr = !cx && TR[r.key] && r.checkout > today ? TR[r.key] : null;
      l += `<div id="bk-${esc(r.key.replace(/[^\w-]/g, '_'))}" class="bk${cx ? ' cx' : ''}${sv ? ' save' : ''}${cw.length || dp.length ? ' cpw' : ''}">
        <div class="d num">${md(r.checkin)}<small>（${wd(r.checkin)}）${r.nights}泊・${r.adults}名</small></div>
        <div><div class="h">${badge(r)}${esc(NAMES[r.hotel] || r.hotel_name)}${OTHER.has(r.hotel) ? '<span class="tag ot">比較対象外</span>' : ''}</div>
          <div class="r">${esc(shortRoom(r))}${cx ? '<span class="tag cx">キャンセル</span>' : r.refundable ? '<span class="tag ok">返金可</span>' : '<span class="tag nr">返金不可</span>'}${ch}${!cx && r.cx_group ? '<span class="tag pd">キャンセル照合中</span>' : ''}${!cx && r.nowatch ? '<span class="tag ot">監視なし</span>' : ''}</div>
          </div>
        <div class="pay num">${r.pay ? yen(r.pay) : '—'}${r.nights > 1 && r.pay ? `<small>1泊 ${yen(Math.round(r.pay / r.nights))}</small>` : ''}</div>
        ${free || wl || tm ? `<div class="w">${tm}${free}${wl}</div>` : ''}
        ${lk}
        ${rbBox(r, today)}
        ${sv ? `<div class="sv">▼ <b>${yen(w.save)}安く</b>取り直せます：${esc(w.best_channel)}［${esc(w.best_kind)}］${esc(w.best_room)} ${yen(w.best_pay)}<br>
          ${esc(w.best_plan)}　<a href="${esc(w.best_url)}" target="_blank" rel="noopener">予約ページへ →</a>${rbStart(r, 'save', `${w.best_channel} ${yen(w.best_pay)}`)}</div>` : ''}
        ${!cx && r.refundable && w && w.nr_ok ? `<div class="sv nr">返金不可にすると <b>${yen(w.nr_save)}安い</b>（${yen(w.nr_pay)}・${esc(w.nr_plan)}）。期限 ${md(w.free_cancel_until)}（${wd(w.free_cancel_until)}）まで（締切の時刻は「予約の詳細」のキャンセル規定で確認）<br>
          <small>返金不可は予約時に全額がかかり、返金されません。新しく予約 → 予約ページへの反映を確認 → いまの予約をキャンセル</small>
          <a href="${esc(w.nr_url)}" target="_blank" rel="noopener">ハイアットで見る →</a>${rbStart(r, 'nr', `返金不可 ${yen(w.nr_pay)}`)}</div>` : ''}
        ${tr ? `<div class="sv tr">ハイアットに振り替え可（<b>${tr.diff >= 0 ? '+' + yen(tr.diff) : '−' + yen(-tr.diff)}</b>・${yen(tr.pay)}）${tr.mode === 'rescue' ? '・救済モード' : ''}。元の予約の無料キャンセル期限 ${md(tr.free_cancel_until)}<br>
          <small>ハイアットを予約 → 予約ページへの反映を確認 → この予約をキャンセル（${md(tr.checked)} 時点の料金）</small>
          <a href="${esc(tr.url)}" target="_blank" rel="noopener">ハイアットで見る →</a>${rbStart(r, 'transfer', `ハイアット ${yen(tr.pay)}`)}</div>` : ''}
        ${dp.length ? `<div class="cw">⚠ 重複の可能性：同じ日に${esc(NAMES[r.hotel] || r.hotel_name)}の予約がほかに${dp.length}件あります（予約番号 ${esc(r.key.split(':').pop())}）。不要ならホテルのサイトでキャンセルしてください</div>` : ''}
        ${cw.length ? `<div class="cw">⚠ 要登録のキャンペーン：${cw.slice(0, 3).map(c => `<a href="campaigns.html">${esc(c.name)}</a>${c.registration_deadline ? `（登録 ${md(c.registration_deadline)}まで）` : ''}`).join('、')}${cw.length > 3 ? ` ほか${cw.length - 3}件` : ''}。未登録です</div>` : ''}
      </div>`;
    });
    if (past) l += '</details>';
  });
  document.getElementById('list').innerHTML = l;
  document.getElementById('trtable').innerHTML = transferTable(Y, today);
  fillTonightTel();
  handleHash();
}

let CPD = null;
async function loadCampaigns(){
  try { CPD = JSON.parse(localStorage.getItem('yoiyado_campaigns') || 'null'); } catch(e) {}
  if (CPD && data) render();
  for (let i = 0; i < 4; i++) {
    try {
      const r = await fetch(GAS + '?api=campaigns&k=' + encodeURIComponent(K), {credentials: 'omit', cache: 'no-store'});
      const t = await r.text();
      if (t.trim().startsWith('{')) {
        const j = JSON.parse(t);
        if (j.campaigns) { CPD = j; try { localStorage.setItem('yoiyado_campaigns', t); } catch(e) {} if (data) render(); }
        return;
      }
    } catch(e) {}
    await new Promise(res => setTimeout(res, 1500 * (i + 1)));
  }
}

try { yearSel = localStorage.getItem('yoiyado_bk_year'); showCx = localStorage.getItem('yoiyado_bk_cx') === '1'; } catch(e) {}
load();
if (K) loadCampaigns();
// ホーム画面から開いた宵宿は裏で開いたままになり、戻っても再読み込みされない。画面に戻ったら最新を取り直す
let lastLoad = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - lastLoad > 30000) { lastLoad = Date.now(); load(); }
});
</script>
